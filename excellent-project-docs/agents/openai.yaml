interface:
  display_name: "Excellent Project Docs"
  short_description: "Build verified README and companion docs from repository facts"
  default_prompt: "Analyze this repository's real features, commands, and usage flow before creating or improving its README and the companion documents it justifies (CONTRIBUTING, SECURITY, ARCHITECTURE, CHANGELOG, ...). Propose new companion files before creating them, keep every claim traceable to evidence, and mark unverified information explicitly."
